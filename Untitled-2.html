<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opacity Demo</title>
    <style>
        /* General Page Style */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5f5f5;
            padding: 20px;
            margin: 0;
        }

        /* Common Box Style */
        .box {
            width: 250px;
            height: 150px;
            background: blue;
            color: white;
            margin: 20px auto; /* Centers the box */
            font-size: 20px;   /* Fixed typo: fontsize -> font-size */
            display: flex;
            justify-content: center;
            align-items: center; /* Fixed typo: alignitems -> align-items */
            border-radius: 10px;
        }

        /* Opacity Levels */
        .o1 { opacity: 1; }
        .o2 { opacity: 0.7; }
        .o3 { opacity: 0.4; }
        .o4 { opacity: 0.2; }
    </style>
</head>
<body>

    <h2>Opacity Property Example</h2>
    
    <div class="box o1">Opacity = 1 (100%)</div>
    <div class="box o2">Opacity = 0.7</div>
    <div class="box o3">Opacity = 0.4</div>
    <div class="box o4">Opacity = 0.2</div>

</body>
</html>
